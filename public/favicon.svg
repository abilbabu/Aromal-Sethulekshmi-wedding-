<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECC875"/>
      <stop offset="50%" stop-color="#D6B265"/>
      <stop offset="100%" stop-color="#9E7B35"/>
    </linearGradient>
    <radialGradient id="emeraldGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14433B"/>
      <stop offset="70%" stop-color="#0A2A22"/>
      <stop offset="100%" stop-color="#051714"/>
    </radialGradient>
  </defs>

  <!-- Background Base: Deep Royal Emerald Circle -->
  <rect width="64" height="64" rx="16" fill="url(#emeraldGrad)"/>
  
  <!-- Subtle Luxury Gold Border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" opacity="0.9"/>
  <rect x="4.5" y="4.5" width="55" height="55" rx="11.5" fill="none" stroke="url(#goldGrad)" stroke-width="0.6" opacity="0.4"/>

  <!-- Monogram: S & A -->
  <text x="32" y="41" 
        font-family="'Playfair Display', 'Cinzel', 'Georgia', 'Times New Roman', serif" 
        font-size="21" 
        font-weight="700" 
        text-anchor="middle" 
        letter-spacing="-0.5px">
    <tspan fill="#FAF7F0">S</tspan>
    <tspan fill="url(#goldGrad)" font-style="italic" font-size="16" font-family="'Cormorant Garamond', serif" dx="1"> &amp; </tspan>
    <tspan fill="#FAF7F0" dx="1">A</tspan>
  </text>
</svg>